# Gateway: única entrada externa. /api -> backend (balanceado), resto -> frontend.

# DNS interno do Docker: reavalia os IPs das réplicas (docker compose up --scale backend=N).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_pool {
    zone backend_pool 64k;
    least_conn;
    server backend:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream frontend_pool {
    zone frontend_pool 64k;
    server frontend:80 resolve;
    keepalive 8;
}

# IP real do cliente quando há um proxy na frente (Traefik / rede Docker).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Protocolo original: https quando o Traefik terminou o TLS, senão o do próprio nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Proteção extra contra força bruta no login/cadastro/recuperação (por IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

log_format gateway '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr rt=$request_time';

server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log gateway;

    include /etc/nginx/snippets/redirect.conf;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log gateway;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/snippets/app.conf;
}
